name: Synk
description: Vi behöver synka med ett annat team om ett problem innan vi vet vad som ska byggas (Discovery).
type: Synk
body:
  - type: markdown
    attributes:
      value: |
        En synk är en förfrågan om ett samtal med ett annat team för att få input, vägledning eller hjälp att reda ut ett behov. Synken är inte en beställning eller ett löfte om att något ska vara genomfört till ett visst datum.

        Sätt Target date till senast när ni hoppas ha haft synken och fått den input ni behöver. Välj datum med framförhållning så att det andra teamet hinner förbereda samtalet. Om ni efter synken kommer överens om att något ska genomföras planeras det separat. Räkna med att synken kan ske under en sprint och att eventuellt genomförandearbete kan planeras in en eller två sprintar därefter.

        För att det ska fungera behöver du:

        1. Sätta **parent** till er egen Feature eller Epic som synken gäller.
        2. Sätta **Target date** till senast när ni hoppas ha haft synken – det är inte ett leveransdatum.
        3. **Flytta** issuet till **det andra teamets Project** – det är där de ser att ni vill prata med dem.

        > **Synken ska bara ligga på det andra teamets bräda, inte på er egen.**
        > Er egen Feature/Epic (parenten) finns redan på er bräda och visar att ni väntar på synken. Ligger synken även på er bräda syns det som att någon vill prata med *er*.
        >
        > Har issuet automatiskt hamnat på er egen bräda (det gör det om det skapas i ert eget repo): lägg till det på det andra teamets bräda och ta sedan bort det från er egen via "…" → "Remove from project". Enklast är att skapa synken direkt i det andra teamets repo.

        **Efter synken är det ni – teamet som bad om synken – som tar det vidare.**
        Det andra teamet har gjort sin del när samtalet är över, om ni inte kommer överens om något annat. Ni:

        - skriver utfallet under "Utfall" nedan och stänger synken,
        - skapar issues för nästa steg (Story/Task) under er Feature/Epic,
        - kommer ni överens om att det andra teamet ska leverera något, skapar ni det issuet i deras repo och kopplar ert väntande issue till det med "Blocked by".
  - type: input
    id: team
    attributes:
      label: Team vi vill prata med
      description: Vilket team behöver ni input från? Tagga gärna teamet, t.ex. @Samhall-AB/infra.
    validations:
      required: true
  - type: textarea
    id: bakgrund
    attributes:
      label: Bakgrund
      description: Vad försöker vi åstadkomma och varför behöver vi det andra teamet?
    validations:
      required: true
  - type: textarea
    id: fragor
    attributes:
      label: Vad vi hoppas få hjälp att reda ut
      description: Vilken input, vägledning eller vilket beslut hoppas vi få från er i samtalet?
      value: |
        -
    validations:
      required: true
  - type: input
    id: deltagare
    attributes:
      label: Vilka bör vara med
      description: Personer eller roller som bör delta i samtalet.
    validations:
      required: false
  - type: textarea
    id: utfall
    attributes:
      label: Utfall
      description: Fylls i av teamet som bad om synken, efter samtalet – vad kom vi fram till, vilka issues skapade vi för nästa steg, och har vi kommit överens om att det andra teamet ska göra något mer?
    validations:
      required: false
