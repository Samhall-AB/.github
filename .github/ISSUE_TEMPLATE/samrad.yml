name: Samråd
description: Vi behöver prata med ett annat team om ett problem innan vi vet vad som ska byggas (Discovery).
type: Samråd
body:
  - type: markdown
    attributes:
      value: |
        Ett samråd är en förfrågan om input eller hjälp från ett annat team. För att det ska fungera behöver du:

        1. Sätta **parent** till er egen Feature eller Epic som samrådet gäller.
        2. Sätta **Target date** till senast när ni behöver inputen.
        3. Lägga till issuet på **det andra teamets Project** – det är där de ser att ni vill prata med dem.

        Samrådet stängs när ni har pratat. Skriv utfallet som en kommentar och länka eventuella leveransärenden (Story/Task) som skapats. Koppla dem med "Blocked by" om ni väntar på dem.
  - type: input
    id: team
    attributes:
      label: Team vi vill prata med
      description: Vilket team behöver ni input från? Tagga gärna teamet, t.ex. @Samhall-AB/infra.
    validations:
      required: true
  - type: textarea
    id: bakgrund
    attributes:
      label: Bakgrund
      description: Vad försöker vi åstadkomma och varför behöver vi det andra teamet?
    validations:
      required: true
  - type: textarea
    id: fragor
    attributes:
      label: Vad vi behöver från er
      description: Vilka frågor vill vi ha svar på, eller vilket beslut behöver vi fatta tillsammans?
      value: |
        -
    validations:
      required: true
  - type: input
    id: deltagare
    attributes:
      label: Vilka bör vara med
      description: Personer eller roller som bör delta i samtalet.
    validations:
      required: false
  - type: textarea
    id: utfall
    attributes:
      label: Utfall
      description: Fylls i efter samtalet – vad kom vi fram till och vilka leveransärenden skapades?
    validations:
      required: false
